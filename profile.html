<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - CompareCart</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="user-profile.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <div class="header-zone-left">
                <a href="main.html" class="logo">
                    <img src="logo-removebg-preview.png" alt="CompareCart" class="logo-image">
                </a>
            </div>

            <div class="header-zone-center">
                <!-- Search bar removed as requested -->
            </div>

            <div class="header-zone-right">
                <div class="user-profile">
                    <div class="avatar" id="avatar">U</div>
                    <ul class="dropdown" id="dropdown">
                        <li><a href="profile.html" class="dropdown-item">Profile</a></li>
                        <li><a href="#" class="dropdown-item">Logout</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <div style="margin-bottom: 20px;">
            <a href="main.html" class="product-card__button" style="display: inline-block; width: auto; background-color: var(--color-secondary); padding: 8px 16px;">
                &larr; Back
            </a>
        </div>

        <div class="auth-card" style="margin: 0 auto;">
            <h2 style="text-align: center; margin-bottom: 20px;">My Profile</h2>
            <div id="profile-content">
                <div class="loading-spinner"></div>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <div class="container">
            <div class="footer-links">
                <a href="main.html">Home</a>
                <a href="about.html">About</a>
                <a href="privacy.html">Privacy</a>
            </div>
            <div class="footer-copy">
                <p>&copy; 2026 CompareCart. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-database.js"></script>
    <script src="script.js"></script>
    <script src="user-profile.js"></script>
</body>
</html>
