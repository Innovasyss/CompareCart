<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CompareCart</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="user-profile.css">
    <link rel="stylesheet" href="sponsored.css">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <div class="header-zone-left">  <!-- Changed from .header-left to match CSS -->
                <a href="main.html" class="logo">
                    <img src="logo-removebg-preview.png" alt="CompareCart" class="logo-image">
                </a>
                <nav class="main-nav">
                    <a href="#" id="nav-favorites">Favorites</a>
                </nav>
            </div>
            <div class="header-zone-center">  <!-- Changed from .header-center -->
                <div class="search-and-filter-cluster">
                    <div class="search-container">
                        <button id="search-button" aria-label="Search">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="search-icon"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        </button>
                        <input type="text" id="search-bar" placeholder="Search for products...">
                    </div>
                    <div class="sort-container">
                        <select id="sort-by" class="sort-dropdown">
                            <option selected disabled>Sort by</option>
                            <option value="price-asc">Price: Low to High</option>
                            <option value="price-desc">Price: High to Low</option>
                            <option value="popularity">Popularity</option>
                        </select>
                    </div>
                    <button id="filter-button" class="filter-button">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="filter-icon"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
                        <span>Filter</span>
                    </button>
                </div>
            </div>
            <div class="header-zone-right">  <!-- Changed from .header-right -->
                <div class="user-profile">
                    <div class="avatar" id="avatar">U</div>
                    <ul class="dropdown" id="dropdown">
                        <li><a href="profile.html" class="dropdown-item">Profile</a></li>
                        <li><a href="#" class="dropdown-item">Logout</a></li>
                    </ul>
                </div>
                <button class="hamburger-menu" id="hamburger-btn" aria-label="Open navigation menu">
                    <span class="icon">☰</span>
                </button>
            </div>
        </div>
    </header>

    <div class="desktop-layout-container">
        <aside class="sponsored-panel">
            <div class="sponsored-label">Sponsored</div>
            <p>Sponsored placement (Amazon / Flipkart affiliate content will appear here)</p>
        </aside>

        <main class="container">
            <section class="product-grid" id="product-grid">
                <!-- Products will be dynamically injected here -->
            </section>
        </main>

        <aside class="sponsored-panel">
            <div class="sponsored-label">Sponsored</div>
            <p>Sponsored placement (Amazon / Flipkart affiliate content will appear here)</p>
        </aside>
    </div>

    <footer class="main-footer">
        <div class="container">
            <div class="footer-links">
                <a href="main.html">Home</a>
                <a href="about.html">About</a>
                <a href="privacy.html">Privacy</a>
            </div>
            <div class="footer-copy">
                <p>&copy; 2026 CompareCart. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-database.js"></script>
    <script src="script.js"></script>
    <script src="user-profile.js"></script>
</body>
</html>
