<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Prices</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="user-profile.css">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <!-- Left Zone: Logo -->
            <div class="header-zone-left">
                <a href="main.html" class="logo">
                    <img src="logo-removebg-preview.png" alt="CompareCart" class="logo-image">
                </a>
            </div>

            <!-- Center Zone: Navigation -->
            <nav class="header-zone-center main-nav">
                <a href="#" id="nav-favorites">Favorites</a>
            </nav>

            <!-- Right Zone: Search and User Profile -->
            <div class="header-zone-right">
                <div class="search-container">
                    <input type="text" id="search-bar" placeholder="Search...">
                    <button id="search-button">Search</button>
                </div>
                <div class="user-profile">
                    <div class="avatar" id="avatar">U</div>
                    <ul class="dropdown" id="dropdown">
                        <li><a href="profile.html" class="dropdown-item">Profile</a></li>
                        <li><a href="#" class="dropdown-item">Logout</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <h2 id="product-name" class="comparison-title"></h2>
        <section id="price-comparison-grid" class="price-comparison-grid">
            <!-- Price comparison results will be dynamically injected here -->
        </section>
    </main>

    <footer class="main-footer">
        <div class="container">
            <div class="footer-links">
                <a href="main.html">Home</a>
                <a href="about.html">About</a>
                <a href="privacy.html">Privacy</a>
            </div>
            <div class="footer-copy">
                <p>&copy; 2026 CompareCart. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-database.js"></script>
    <script src="script.js"></script>
    <script src="user-profile.js"></script>
</body>
</html>
